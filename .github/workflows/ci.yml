name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: resilnet_core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo test
        run: cargo test

  gateway-protocol:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: flutter test gateway HaLow / LoRa-only regression
        run: flutter test test/gateway_control_test.dart

  esp32-lora-gateway-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: esp32_firmware
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PlatformIO
        run: pip install platformio
      - name: Build LoRa gateway (HALOW_ENABLE=0 default)
        run: pio run -e lora_gateway
