name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: resilnet_core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo test
        run: cargo test

  gateway-protocol:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: flutter test gateway HaLow / LoRa-only regression
        run: flutter test test/gateway_control_test.dart

  # The job above covers one regression file. This one is the app's own gate:
  # the analyzer plus the whole test suite.
  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: flutter pub get
        run: flutter pub get
      # Scoped to lib/ and test/ on purpose: rust_builder/cargokit is a
      # vendored build tool with its own pubspec, and
      # integration_test/simple_test.dart is a flutter_rust_bridge template
      # leftover referencing a MyApp this app never had. Errors and warnings
      # fail the build; the ~24 remaining style infos do not.
      - name: flutter analyze
        run: flutter analyze --no-fatal-infos lib test
      - name: flutter test
        run: flutter test

  esp32-lora-gateway-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: esp32_firmware
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PlatformIO
        run: pip install platformio
      - name: Build LoRa gateway (HALOW_ENABLE=0 default)
        run: pio run -e lora_gateway
