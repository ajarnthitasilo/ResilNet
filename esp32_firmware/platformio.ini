; ResilNet ESP32 Firmware — Standalone Mule + LoRa Gateway (BLE OTA)
; Build:
;   pio run -e standalone
;   pio run -e lora_gateway

[platformio]
default_envs = standalone

[env]
; Pinned to the toolchain of the last green CI build (main @ c104806,
; 2026-08-30). These were open ranges, so a platform bump from 7.0.1 to 8.0.0
; turned that same commit red months later with no firmware change. Bump these
; deliberately, in their own change, not by accident.
platform = espressif32@7.0.1
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions_two_ota.csv
board_build.filesystem = littlefs
lib_deps =
    h2zero/NimBLE-Arduino@2.5.1
    bblanchon/ArduinoJson@7.4.3
build_flags =
    -DCORE_DEBUG_LEVEL=1

; Role A: BLE Data Mule (Standalone Node) + OTA
[env:standalone]
build_flags =
    ${env.build_flags}
    -DNODE_TYPE_STANDALONE
build_src_filter =
    +<*>
    -<ble_manager.cpp>
    -<lora_manager.cpp>
    -<packet.cpp>
    -<transport_router.cpp>
    -<wifi_udp_bridge.cpp>

; Role B: BLE ↔ LoRa Gateway + OTA
[env:lora_gateway]
build_flags =
    ${env.build_flags}
    -DNODE_TYPE_LORA_GATEWAY
lib_deps =
    ${env.lib_deps}
    jgromes/RadioLib@7.7.1
build_src_filter =
    +<*>
    -<MessageStore.cpp>
    -<ReceivedIdsStore.cpp>

[env:lora_gateway_433]
extends = env:lora_gateway
build_flags =
    ${env:lora_gateway.build_flags}
    -DLORA_FREQ_HZ=433000000UL

; เปิด SoftAP ตลอด (ไม่ปิดอัตโนมัติหลัง idle 5 นาที)
[env:lora_gateway_ap_always_on]
extends = env:lora_gateway
build_flags =
    ${env:lora_gateway.build_flags}
    -DWIFI_AP_ALWAYS_ON=1
