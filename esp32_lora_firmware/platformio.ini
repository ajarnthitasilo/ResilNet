; ResilNet ESP32 LoRa Firmware — Gateway + Standalone Repeater
; สลับโหมดด้วย environment:
;   pio run -e lora_gateway
;   pio run -e lora_repeater

[platformio]
default_envs = lora_gateway

; ค่าร่วมทุก environment
[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    h2zero/NimBLE-Arduino@^2.1.0
    jgromes/RadioLib@^7.1.2
    bblanchon/ArduinoJson@^7.2.0
build_flags =
    -DCORE_DEBUG_LEVEL=1

; Role A: BLE ↔ LoRa Gateway (เชื่อมมือถือ Flutter)
[env:lora_gateway]
extends = env
build_flags =
    ${env.build_flags}
    -DNODE_TYPE_LORA_GATEWAY

; Role B: Standalone LoRa Repeater (ไม่ต้องเปิด BLE ตลอด)
[env:lora_repeater]
extends = env
build_flags =
    ${env.build_flags}
    -DNODE_TYPE_STANDALONE_REPEATER

; ความถี่ 433 MHz
[env:lora_gateway_433]
extends = env:lora_gateway
build_flags =
    ${env:lora_gateway.build_flags}
    -DLORA_FREQ_HZ=433000000UL

[env:lora_repeater_433]
extends = env:lora_repeater
build_flags =
    ${env:lora_repeater.build_flags}
    -DLORA_FREQ_HZ=433000000UL
