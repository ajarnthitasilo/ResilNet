<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1224"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1024" height="1024" rx="220" fill="url(#bg)"/>

  <!-- Mesh links (decentralized network) -->
  <g stroke="#10B981" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" opacity="0.95" filter="url(#glow)">
    <path d="M 290 650 L 420 520 L 512 610 L 604 470 L 740 600" fill="none"/>
    <path d="M 330 380 L 420 520 L 300 560" fill="none" opacity="0.75"/>
    <path d="M 604 470 L 700 430 L 740 600" fill="none" opacity="0.75"/>
    <path d="M 512 610 L 560 735 L 420 780" fill="none" opacity="0.75"/>
  </g>

  <!-- Community / nodes -->
  <g>
    <!-- Outer ring for resilience -->
    <circle cx="512" cy="540" r="300" fill="none" stroke="#10B981" stroke-width="14" opacity="0.25"/>
    <circle cx="512" cy="540" r="260" fill="none" stroke="#10B981" stroke-width="10" opacity="0.18"/>

    <!-- Nodes -->
    <g fill="#10B981" filter="url(#glow)">
      <circle cx="290" cy="650" r="26"/>
      <circle cx="420" cy="520" r="22"/>
      <circle cx="512" cy="610" r="24"/>
      <circle cx="604" cy="470" r="22"/>
      <circle cx="740" cy="600" r="26"/>
      <circle cx="330" cy="380" r="20" opacity="0.9"/>
      <circle cx="300" cy="560" r="18" opacity="0.85"/>
      <circle cx="700" cy="430" r="18" opacity="0.85"/>
      <circle cx="560" cy="735" r="20" opacity="0.9"/>
      <circle cx="420" cy="780" r="20" opacity="0.9"/>
    </g>

    <!-- Central shield (secure messaging) -->
    <g transform="translate(0,-10)">
      <path d="M512 330
               C 592 366, 660 378, 714 388
               C 714 520, 676 624, 512 712
               C 348 624, 310 520, 310 388
               C 364 378, 432 366, 512 330 Z"
            fill="#0F172A" stroke="#10B981" stroke-width="16" opacity="0.98" filter="url(#glow)"/>
      <path d="M512 400
               C 562 428, 602 438, 638 446
               C 638 534, 612 604, 512 664
               C 412 604, 386 534, 386 446
               C 422 438, 462 428, 512 400 Z"
            fill="none" stroke="#10B981" stroke-width="12" opacity="0.55"/>
      <!-- Lock -->
      <g transform="translate(0,0)" fill="none" stroke="#10B981" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" opacity="0.9">
        <path d="M 460 540 V 508 C 460 474 486 448 520 448 C 554 448 580 474 580 508 V 540"/>
        <rect x="440" y="540" width="160" height="140" rx="28"/>
        <path d="M520 590 V 632"/>
        <circle cx="520" cy="586" r="14" fill="#10B981" stroke="none"/>
      </g>
    </g>
  </g>
</svg>
