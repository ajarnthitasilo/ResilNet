<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Open this ResilNet invite in the app" />
  <title>ResilNet Invite</title>
  <style>
    :root { color-scheme: light dark; --accent: #10b981; --bg: #0b1224; --fg: #f4f7fb; }
    @media (prefers-color-scheme: light) {
      :root { --bg: #f4f7fb; --fg: #0b1224; }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg); color: var(--fg);
      display: flex; align-items: center; justify-content: center; padding: 24px;
    }
    main {
      max-width: 420px; width: 100%; text-align: center;
    }
    h1 { font-size: 1.5rem; margin: 0 0 8px; letter-spacing: 0.02em; }
    p { opacity: 0.8; line-height: 1.45; margin: 0 0 20px; }
    .btn {
      display: inline-block; background: var(--accent); color: #06281c;
      font-weight: 700; text-decoration: none; border: none; cursor: pointer;
      padding: 14px 22px; border-radius: 12px; font-size: 1rem; width: 100%;
    }
    .btn.secondary {
      margin-top: 10px; background: transparent; color: var(--fg);
      border: 1px solid color-mix(in srgb, var(--fg) 35%, transparent);
    }
    .err { color: #f87171; margin-top: 16px; }
    .hint { font-size: 0.85rem; margin-top: 18px; opacity: 0.65; }
  </style>
</head>
<body>
  <main>
    <h1>ResilNet</h1>
    <p id="blurb">Open this invite in the ResilNet app.</p>
    <button class="btn" id="open" type="button">Open in ResilNet</button>
    <button class="btn secondary" id="copy" type="button">Copy link</button>
    <p class="err" id="err" hidden>This invite link is missing or invalid.</p>
    <p class="hint">If nothing opens, install ResilNet, then tap Open again.</p>
  </main>
  <script>
    (function () {
      var params = new URLSearchParams(location.search);
      var t = (params.get('t') || '').toLowerCase();
      var d = (params.get('d') || '').trim();
      var deep = '';
      var blurb = document.getElementById('blurb');
      if (t === 'b' && d) {
        deep = 'resilnet://board/invite?d=' + d;
        blurb.textContent = 'Community board invite — open in ResilNet to follow.';
      } else if (t === 'p' && d) {
        deep = 'resilnet://peer/invite?d=' + d;
        blurb.textContent = 'Identity invite — open in ResilNet to add this peer.';
      } else {
        document.getElementById('err').hidden = false;
        document.getElementById('open').disabled = true;
        document.getElementById('copy').disabled = true;
        return;
      }
      window.__RESILNET_DEEP__ = deep;
      function openApp() {
        location.href = deep;
      }
      document.getElementById('open').addEventListener('click', openApp);
      document.getElementById('copy').addEventListener('click', function () {
        var text = location.href;
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text);
        } else {
          prompt('Copy this link', text);
        }
      });
      // Best-effort auto-open (mobile); landing stays if the app is not installed.
      setTimeout(openApp, 350);
    })();
  </script>
</body>
</html>
